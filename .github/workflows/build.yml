name: Build THE FRACTURE Beta
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: THE-FRACTURE-Beta-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
