plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { "${mod_id}" { source sourceSets.main } } }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }

processResources {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range, forge_version: forge_version, forge_version_range: forge_version_range, loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

jar.finalizedBy('reobfJar')
